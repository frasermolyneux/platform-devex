name: "delegate-failed-checks"
description: "Delegates same-repository Copilot and Dependabot pull requests with failed checks once per failing commit, escalating after an attempt cap; human-authored and untrusted PRs are left alone"

inputs:
  github-token:
    description: "Token with pull-requests:read and checks:read on the target repository, used for all read-only lookups (listing pull requests, checks, and existing comments). Also needs issues:write, since it is used to post the delegation comment when mention-token is not supplied."
    required: true
  mention-token:
    description: "Personal access token from a human user with write access and Copilot entitlement on the target repository. GitHub's Copilot coding agent only acts on @copilot mentions authored by a real user; comments posted by a GitHub App or other bot identity are ignored, so the delegation comment must be posted with this token rather than github-token. Falls back to github-token (which will not trigger Copilot) when not provided."
    required: false
    default: ""
  repository:
    description: "Target repository in owner/repo form"
    required: true
  exclude-authors:
    description: "Comma-separated pull request author logins to skip (e.g. dependabot[bot])"
    required: false
    default: ""
  dry-run:
    description: "When true, only report which pull requests would be delegated"
    required: false
    default: "false"
  max-delegations:
    description: "Maximum number of delegation comments (counted across all commits) to post on a single pull request before escalating instead of delegating again. Guards against an indefinite delegate/fail/re-delegate loop when the actual cause is environmental (e.g. cloud credentials, provider auth) and Copilot cannot fix it by changing code."
    required: false
    default: "3"
  escalation-label:
    description: "Label to add to the pull request when the delegation cap is reached (e.g. 'needs-human'). Best-effort: if the label does not already exist in the repository, adding it is skipped with a warning rather than failing the step. Leave empty to skip labeling entirely."
    required: false
    default: ""
  trusted-bot-login:
    description: "Login (including the [bot] suffix, e.g. 'my-app[bot]') of the bot identity that github-token posts as. Delegation/escalation marker comments are only trusted from this login (when also reported as a Bot) or from whichever identity mention-token/github-token itself resolves to for the current run, so an unrelated installed bot (SonarCloud, Dependabot, etc.) or any other participant cannot spoof a marker to suppress delegation or force escalation - author_association is deliberately not used for this, since it does not reliably indicate write access. Defaults to the built-in Actions token's identity."
    required: false
    default: "github-actions[bot]"

outputs:
  delegated_count:
    description: "Number of pull requests delegated to Copilot (or that would be, in dry-run)"
    value: ${{ steps.delegate.outputs.delegated_count }}
  delegated_pull_requests:
    description: "Comma-separated pull request numbers that were delegated (or would be, in dry-run)"
    value: ${{ steps.delegate.outputs.delegated_pull_requests }}
  escalated_count:
    description: "Number of pull requests left pending human attention after reaching max-delegations (or that would be, in dry-run)"
    value: ${{ steps.delegate.outputs.escalated_count }}
  escalated_pull_requests:
    description: "Comma-separated pull request numbers that were escalated (or would be, in dry-run)"
    value: ${{ steps.delegate.outputs.escalated_pull_requests }}

runs:
  using: "composite"
  steps:
    - name: Delegate failed checks to Copilot
      id: delegate
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        MENTION_TOKEN: ${{ inputs.mention-token }}
        REPOSITORY: ${{ inputs.repository }}
        EXCLUDE_AUTHORS: ${{ inputs.exclude-authors }}
        DRY_RUN: ${{ inputs.dry-run }}
        MAX_DELEGATIONS: ${{ inputs.max-delegations }}
        ESCALATION_LABEL: ${{ inputs.escalation-label }}
        TRUSTED_BOT_LOGIN: ${{ inputs.trusted-bot-login }}
      run: |
        set -euo pipefail

        # Check the digit-count bound with string length (safe for any
        # input size) before any arithmetic comparison is attempted
        # elsewhere: a value that passes a plain ^[1-9][0-9]*$ regex but
        # exceeds bash's 64-bit signed arithmetic range (e.g.
        # 18446744073709551616) would silently wrap during later `-ge`/`-lt`
        # comparisons, e.g. evaluating as 0 and escalating a PR that has had
        # zero delegations. 6 digits (max 999999) is far beyond any sane
        # real-world cap while staying comfortably inside that range.
        if ! [[ "$MAX_DELEGATIONS" =~ ^[1-9][0-9]*$ ]] || [[ ${#MAX_DELEGATIONS} -gt 6 ]]; then
          echo "::error::max-delegations must be a positive integer with no leading zeros and at most 6 digits (max 999999), got: ${MAX_DELEGATIONS}"
          exit 1
        fi

        MARKER="<!-- devex-copilot-delegate -->"
        ESCALATION_MARKER="<!-- devex-copilot-delegate-escalated -->"


        # Comments must be posted with a human user's token or Copilot's
        # coding agent will not act on the @copilot mention (see
        # mention-token description). Fall back to github-token so the
        # action still runs (and still reports what it would delegate) when
        # no mention-token is configured, but warn loudly since the mention
        # will be inert in that case.
        COMMENT_TOKEN="${MENTION_TOKEN:-$GH_TOKEN}"
        if [[ -z "$MENTION_TOKEN" ]]; then
          echo "::warning::mention-token not set; delegation comments will be posted with github-token and Copilot will not act on them"
        fi

        # Resolve the login that COMMENT_TOKEN actually posts as, once, so
        # it can be trusted directly by identity rather than by
        # author_association (association is not a reliable write-access
        # proxy - see TRUSTED_FILTER below for why it's not used at all).
        if [[ -n "$MENTION_TOKEN" ]]; then
          # A human PAT: the /user endpoint authenticates it directly.
          COMMENT_LOGIN=$(GH_TOKEN="$COMMENT_TOKEN" gh api user --jq '.login')
        else
          # COMMENT_TOKEN falls back to github-token, which is typically a
          # GitHub App installation token; the /user endpoint only
          # authenticates OAuth/PAT tokens; not installation tokens, so
          # calling it here would abort the whole action (set -e). An
          # installation token posts comments as the configured bot
          # identity (see trusted-bot-login's description), so use that
          # directly instead of resolving it over the API.
          COMMENT_LOGIN="$TRUSTED_BOT_LOGIN"
        fi

        IFS=',' read -ra EXCLUDED <<< "${EXCLUDE_AUTHORS}"

        # Captured via assignment (not process substitution) so a failing
        # `gh api` call trips `set -e` instead of being silently swallowed.
        PR_NUMBERS_RAW=$(gh api "repos/${REPOSITORY}/pulls?state=open&per_page=100" --paginate --jq '.[].number')

        DELEGATED=()
        ESCALATED=()
        if [[ -n "$PR_NUMBERS_RAW" ]]; then
          while IFS= read -r NUM; do
            [[ -z "$NUM" ]] && continue

            PR_JSON=$(gh api "repos/${REPOSITORY}/pulls/${NUM}")
            DRAFT=$(echo "$PR_JSON" | jq -r '.draft')
            AUTHOR=$(echo "$PR_JSON" | jq -r '.user.login')
            SHA=$(echo "$PR_JSON" | jq -r '.head.sha')

            if [[ "$DRAFT" == "true" ]]; then
              continue
            fi

            AUTOMATION=$(node "${GITHUB_ACTION_PATH}/eligibility.mjs" "$REPOSITORY" <<< "$PR_JSON")
            if [[ "$AUTOMATION" == "manual-or-untrusted" ]]; then
              echo "PR #${NUM}: not a trusted same-repository Copilot or Dependabot PR; skipping delegation and escalation"
              continue
            fi

            SKIP=false
            for EX in "${EXCLUDED[@]:-}"; do
              EX="${EX#"${EX%%[![:space:]]*}"}"
              EX="${EX%"${EX##*[![:space:]]}"}"
              [[ -z "$EX" ]] && continue
              if [[ "$AUTHOR" == "$EX" ]]; then
                SKIP=true
                break
              fi
            done
            if [[ "$SKIP" == "true" ]]; then
              continue
            fi

            # `--jq` runs per response page, so emit one failing check-run id
            # per line (stable across pages) and count lines, rather than
            # counting per page (which would yield a multiline result).
            # Treat timed-out and startup-failed runs as failures too.
            FAILED_IDS=$(gh api "repos/${REPOSITORY}/commits/${SHA}/check-runs" --paginate --jq '.check_runs[]? | select(.conclusion == "failure" or .conclusion == "timed_out" or .conclusion == "startup_failure") | .id')
            FAILED_COUNT=0
            if [[ -n "$FAILED_IDS" ]]; then
              FAILED_COUNT=$(printf '%s\n' "$FAILED_IDS" | grep -c '.')
            fi
            if [[ "$FAILED_COUNT" -eq 0 ]]; then
              continue
            fi

            # `gh api --jq` doesn't accept `--arg`; emit one comment object
            # per line across all pages, then slurp into external `jq` (which
            # does support `--arg`) for the marker/sha containment check.
            COMMENTS_RAW=$(gh api "repos/${REPOSITORY}/issues/${NUM}/comments?per_page=100" --paginate --jq '.[]')

            # Trust only the exact identities this action can itself post
            # comments as - never author_association. GitHub's association
            # values do not reliably imply write access: "COLLABORATOR" is
            # set for any explicitly added collaborator regardless of
            # whether their actual role is read/triage/write/admin, and
            # "MEMBER" only signals org membership. A read-only collaborator
            # or org member could otherwise comment a forged marker to
            # suppress delegation or force escalation. The two identities
            # trusted here are:
            #   - the resolved login of COMMENT_TOKEN itself (COMMENT_LOGIN)
            #     - this is the action's own identity for this run, and
            #     resolves fresh each run so rotating which human holds
            #     mention-token is handled automatically;
            #   - the configured bot login, but only when GitHub also
            #     reports it as a Bot (author_association alone can't be
            #     trusted for the github-token App identity, which shows
            #     "NONE", and generic .user.type=="Bot" would wrongly trust
            #     unrelated bots like Dependabot/SonarCloud).
            # A participant who is neither of these can fake neither: login
            # and type are set by GitHub, not comment content.
            # shellcheck disable=SC2016 # intentional: $bot_login/$comment_login
            # are jq variable references (bound via --arg below), not bash
            # expansions, so this must stay single-quoted.
            TRUSTED_FILTER='(.user.login == $comment_login or (.user.login == $bot_login and .user.type == "Bot"))'
            TRUSTED_JQ_ARGS=(--arg bot_login "$TRUSTED_BOT_LOGIN" --arg comment_login "$COMMENT_LOGIN")

            ALREADY_ESCALATED=0
            if [[ -n "$COMMENTS_RAW" ]]; then
              ALREADY_ESCALATED=$(printf '%s\n' "$COMMENTS_RAW" | jq -s --arg marker "$ESCALATION_MARKER" "${TRUSTED_JQ_ARGS[@]}" "[.[] | select(${TRUSTED_FILTER}) | select(.body | contains(\$marker))] | length")
            fi
            if [[ "$ALREADY_ESCALATED" -gt 0 ]]; then
              echo "PR #${NUM}: already escalated to a human; not re-delegating"
              continue
            fi

            # Check the current-sha dedup before the cap: if this exact
            # commit was already delegated, the sweep has nothing new to
            # act on (Copilot may still be working the prior attempt), so
            # skip rather than escalating an unchanged sha just because the
            # cap happens to have been reached already.
            ALREADY_DELEGATED=$(printf '%s\n' "$COMMENTS_RAW" | jq -s --arg marker "$MARKER" --arg sha "$SHA" "${TRUSTED_JQ_ARGS[@]}" "[.[] | select(${TRUSTED_FILTER}) | select(.body | contains(\$marker)) | select(.body | contains(\$sha))] | length")
            if [[ "$ALREADY_DELEGATED" -gt 0 ]]; then
              echo "PR #${NUM}: already delegated for sha ${SHA}"
              continue
            fi

            # Cap counts every delegation comment ever posted on this pull
            # request (any commit), not just ones matching the current sha
            # - otherwise a PR where Copilot keeps pushing new (still
            # failing) commits would be delegated again on every single
            # commit forever, e.g. when the real cause is environmental
            # (cloud credentials, provider auth) and no code change can fix
            # it. Once the cap is hit, escalate once instead of delegating
            # again.
            TOTAL_DELEGATIONS=0
            if [[ -n "$COMMENTS_RAW" ]]; then
              TOTAL_DELEGATIONS=$(printf '%s\n' "$COMMENTS_RAW" | jq -s --arg marker "$MARKER" "${TRUSTED_JQ_ARGS[@]}" "[.[] | select(${TRUSTED_FILTER}) | select(.body | contains(\$marker))] | length")
            fi
            if [[ "$TOTAL_DELEGATIONS" -ge "$MAX_DELEGATIONS" ]]; then
              if [[ "$DRY_RUN" == "true" ]]; then
                echo "Dry-run: would escalate PR #${NUM} to a human (${TOTAL_DELEGATIONS} delegation(s) already attempted, cap is ${MAX_DELEGATIONS})"
              else
                # Use plain "Copilot" (no @ mention) so posting this
                # escalation comment with a human mention-token cannot
                # itself re-trigger the coding agent and undo the cap.
                ESCALATION_BODY=$(printf '%s\nThis pull request has been delegated to Copilot %s time(s) without resolving its failing checks. Stopping automatic re-delegation; this needs a human to look at it directly.' "$ESCALATION_MARKER" "$TOTAL_DELEGATIONS")
                GH_TOKEN="$COMMENT_TOKEN" gh api "repos/${REPOSITORY}/issues/${NUM}/comments" -f body="$ESCALATION_BODY" --silent
                if [[ -n "$ESCALATION_LABEL" ]]; then
                  GH_TOKEN="$COMMENT_TOKEN" gh api "repos/${REPOSITORY}/issues/${NUM}/labels" -f "labels[]=${ESCALATION_LABEL}" --silent \
                    || echo "::warning::failed to add label '${ESCALATION_LABEL}' to PR #${NUM} (it may not exist in this repository)"
                fi
                echo "Escalated PR #${NUM} to a human (${TOTAL_DELEGATIONS} delegation(s) already attempted, cap is ${MAX_DELEGATIONS})"
              fi
              ESCALATED+=("${NUM}")
              continue
            fi

            if [[ "$DRY_RUN" == "true" ]]; then
              echo "Dry-run: would delegate PR #${NUM} (${FAILED_COUNT} failing check(s) at ${SHA})"
            else
              BODY=$(printf '%s<!-- sha:%s -->\n@copilot investigate and resolve the failed checks on this pull request.' "$MARKER" "$SHA")
              GH_TOKEN="$COMMENT_TOKEN" gh api "repos/${REPOSITORY}/issues/${NUM}/comments" -f body="$BODY" --silent
              echo "Delegated PR #${NUM} (${FAILED_COUNT} failing check(s) at ${SHA})"
            fi
            DELEGATED+=("${NUM}")
          done <<< "$PR_NUMBERS_RAW"
        fi

        COUNT=${#DELEGATED[@]}
        JOINED=$(IFS=,; echo "${DELEGATED[*]:-}")
        ESCALATED_COUNT=${#ESCALATED[@]}
        ESCALATED_JOINED=$(IFS=,; echo "${ESCALATED[*]:-}")

        echo "Delegated ${COUNT} pull request(s): ${JOINED:-none}; escalated ${ESCALATED_COUNT} pull request(s): ${ESCALATED_JOINED:-none}"
        {
          echo "delegated_count=${COUNT}"
          echo "delegated_pull_requests=${JOINED}"
          echo "escalated_count=${ESCALATED_COUNT}"
          echo "escalated_pull_requests=${ESCALATED_JOINED}"
        } >> "$GITHUB_OUTPUT"
