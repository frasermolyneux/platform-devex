name: Reviewed Terraform CLI Updates

on:
  schedule:
    - cron: "37 0 * * 0"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Only report proposed pin updates (no target writes)
        type: boolean
        default: true
      repository:
        description: Optional installed repository name (empty discovers all)
        type: string
        default: ""

permissions: {}

concurrency:
  group: platform-devex-terraform-cli
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      repos: ${{ steps.list.outputs.repos }}
      releases: ${{ steps.list.outputs.releases }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Create read-only installation discovery token
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349
        with:
          app-id: ${{ vars.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PEM }}
          owner: ${{ github.repository_owner }}
          permission-metadata: read
      - name: Discover nonarchived nonfork installation repositories
        id: list
        run: node scripts/terraform-cli.mjs discover
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          OWNER: ${{ github.repository_owner }}
          SELECTED_REPOSITORY: ${{ inputs.repository }}

  update:
    needs: discover
    if: needs.discover.outputs.repos != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        repo: ${{ fromJson(needs.discover.outputs.repos) }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Create least-privilege repository token
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349
        with:
          app-id: ${{ vars.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PEM }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ matrix.repo }}
          permission-contents: ${{ (github.event_name == 'workflow_dispatch' && !inputs.dry_run || github.event_name == 'schedule' && vars.TF_CLI_UPDATES_ENABLED == 'true') && 'write' || 'read' }}
          permission-pull-requests: ${{ (github.event_name == 'workflow_dispatch' && !inputs.dry_run || github.event_name == 'schedule' && vars.TF_CLI_UPDATES_ENABLED == 'true') && 'write' || 'read' }}
          permission-checks: read
          permission-statuses: read
      - name: Reconcile reviewed CLI-pin proposal
        run: node scripts/terraform-cli.mjs reconcile
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPOSITORY: ${{ github.repository_owner }}/${{ matrix.repo }}
          APP_BOT: ${{ steps.app-token.outputs.app-slug }}[bot]
          OFFICIAL_RELEASES: ${{ needs.discover.outputs.releases }}
          DRY_RUN: ${{ (github.event_name == 'workflow_dispatch' && !inputs.dry_run || github.event_name == 'schedule' && vars.TF_CLI_UPDATES_ENABLED == 'true') && 'false' || 'true' }}
      - name: Upload metadata-only result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: terraform-cli-${{ matrix.repo }}
          path: terraform-cli-result.json
          if-no-files-found: error
          retention-days: 7

  summarize:
    needs: [discover, update]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      issues: write
    steps:
      - name: Download per-repository results
        id: download
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: terraform-cli-*
          path: results
      - name: Report activity and incomplete collection
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          REPOS: ${{ needs.discover.outputs.repos }}
          DISCOVER: ${{ needs.discover.result }}
          UPDATE: ${{ needs.update.result }}
          DOWNLOAD: ${{ steps.download.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          expected=$(jq -r 'length' <<< "${REPOS:-[]}")
          count=$(find results -type f -name terraform-cli-result.json 2>/dev/null | wc -l || true)
          incomplete=false
          if [[ "$DISCOVER" != success || "$count" -ne "$expected" || ( "$expected" -gt 0 && ( "$UPDATE" != success || "$DOWNLOAD" != success ) ) ]]; then
            incomplete=true
          fi
          {
            echo "## Reviewed Terraform CLI maintenance"
            echo ""
            echo "[Run]($RUN_URL) — incomplete: $incomplete; collected: $count/$expected."
            echo ""
            echo "| Repository | Outcome | PR | Observed checks |"
            echo "| --- | --- | --- | --- |"
            if [[ -d results ]]; then
              find results -type f -name terraform-cli-result.json -print0 | sort -z | while IFS= read -r -d '' file; do
                jq -r '[.repository, .status, (.pullRequest // "—" | tostring), (.checks.state // "not inspected")] | "| " + join(" | ") + " |"' "$file"
              done
            fi
            echo ""
            echo "See private metadata artifacts/job summaries for source digests, compatibility gaps and errors. No source execution, merge or deployment is performed."
          } | tee -a "$GITHUB_STEP_SUMMARY" > terraform-cli-summary.md
          issue=$(gh issue list --repo "$REPOSITORY" --search "Self-heal activity log in:title" --state open --json number --jq '.[0].number // empty')
          if [[ -z "$issue" ]]; then
            issue=$(gh api "repos/$REPOSITORY/issues" -f title="Self-heal activity log" -f body="Scheduled maintenance activity and incomplete runs." --jq '.number')
          fi
          gh issue comment "$issue" --repo "$REPOSITORY" --body-file terraform-cli-summary.md
          [[ "$incomplete" == false ]]
