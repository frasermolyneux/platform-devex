name: Publication installer tests

on:
  pull_request:
    paths:
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/publication-installer-tests.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/publication-installer-tests.yml'
  workflow_dispatch:

permissions: {}

jobs:
  publication-installer:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '22'
          package-manager-cache: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'
      - run: python -m pip install -r scripts/publication-guard-requirements.txt
      - run: npm ci
      - name: Fetch hash-verified immutable metadata helper
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/publication_guard.py fetch-helper --out .publication-origin-contract
      - run: npm run check
      - run: npm test
        env:
          PUBLICATION_ORIGIN_DIRECTORY: .publication-origin-contract
