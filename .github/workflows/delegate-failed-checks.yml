name: Delegate Failed Pull Request Checks

on:
  schedule:
    - cron: "10,40 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: platform-devex-delegate-failed-checks
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      repos: ${{ steps.list.outputs.repos }}
    steps:
      - name: Create discovery GitHub App token
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349
        with:
          app-id: ${{ vars.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PEM }}
          owner: ${{ github.repository_owner }}

      - name: List installation repositories
        id: list
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          names=$(gh api /installation/repositories --paginate --jq '.repositories[].name')
          repos_json=$(printf '%s\n' "$names" | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "repos=$repos_json" >> "$GITHUB_OUTPUT"

  sweep:
    needs: discover
    if: ${{ needs.discover.outputs.repos != '[]' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        repo: ${{ fromJson(needs.discover.outputs.repos) }}
    steps:
      - name: Check out trusted maintenance actions
        id: checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Create repository-scoped GitHub App token
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349
        with:
          app-id: ${{ vars.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PEM }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ matrix.repo }}
          permission-pull-requests: write
          permission-checks: read

      - name: Delegate failed checks to Copilot
        id: delegate-failed-checks
        if: ${{ steps.checkout.outcome == 'success' && steps.app-token.outcome == 'success' }}
        uses: ./.github/actions/delegate-failed-checks
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          mention-token: ${{ secrets.COPILOT_AGENT_PAT }}
          repository: ${{ github.repository_owner }}/${{ matrix.repo }}
          trusted-bot-login: ${{ steps.app-token.outputs.app-slug }}[bot]
          same-repository-only: "true"

      - name: Write per-repo activity summary
        id: activity-summary
        if: always()
        shell: bash
        env:
          REPO: ${{ matrix.repo }}
          CHECKOUT_OUTCOME: ${{ steps.checkout.outcome }}
          APP_TOKEN_OUTCOME: ${{ steps.app-token.outcome }}
          ACTION_OUTCOME: ${{ steps.delegate-failed-checks.outcome }}
          DELEGATED_COUNT: ${{ steps.delegate-failed-checks.outputs.delegated_count }}
          DELEGATED_PRS: ${{ steps.delegate-failed-checks.outputs.delegated_pull_requests }}
          ESCALATED_COUNT: ${{ steps.delegate-failed-checks.outputs.escalated_count }}
          ESCALATED_PRS: ${{ steps.delegate-failed-checks.outputs.escalated_pull_requests }}
        run: |
          set -euo pipefail
          FAILED=false
          if [[ "$CHECKOUT_OUTCOME" != "success" || "$APP_TOKEN_OUTCOME" != "success" || "$ACTION_OUTCOME" != "success" ]]; then
            FAILED=true
          fi
          TOTAL=$(( ${DELEGATED_COUNT:-0} + ${ESCALATED_COUNT:-0} ))
          if [[ "$FAILED" == "false" && "$TOTAL" -eq 0 ]]; then
            echo "has_activity=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "has_activity=true" >> "$GITHUB_OUTPUT"

          if [[ "$FAILED" == "true" ]]; then
            echo "| ${REPO} | ⚠️ sweep failed - see run logs | |" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "| ${REPO} | ${DELEGATED_COUNT} (${DELEGATED_PRS:-}) | ${ESCALATED_COUNT} (${ESCALATED_PRS:-}) |" >> "$GITHUB_STEP_SUMMARY"
          fi

          mkdir -p "${RUNNER_TEMP}/sweep-result"
          jq -n \
            --arg repo "$REPO" \
            --argjson failed "$FAILED" \
            --argjson delegated "${DELEGATED_COUNT:-0}" \
            --arg delegated_prs "${DELEGATED_PRS:-}" \
            --argjson escalated "${ESCALATED_COUNT:-0}" \
            --arg escalated_prs "${ESCALATED_PRS:-}" \
            '{repo: $repo, failed: $failed, delegated: $delegated, delegated_prs: $delegated_prs, escalated: $escalated, escalated_prs: $escalated_prs}' \
            > "${RUNNER_TEMP}/sweep-result/repo-${REPO}.json"

      - name: Upload activity result
        if: ${{ always() && steps.activity-summary.outputs.has_activity == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sweep-result-${{ matrix.repo }}
          path: ${{ runner.temp }}/sweep-result/*.json
          retention-days: 7

  summarize:
    needs: [discover, sweep]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      issues: write
      actions: read
    steps:
      - name: Download activity results
        id: download
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: sweep-result-*
          path: results
          merge-multiple: true

      - name: Build and post activity summary
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DISCOVER_RESULT: ${{ needs.discover.result }}
          SWEEP_RESULT: ${{ needs.sweep.result }}
          REPOS: ${{ needs.discover.outputs.repos }}
          DOWNLOAD_OUTCOME: ${{ steps.download.outcome }}
        run: |
          set -euo pipefail
          INCOMPLETE=false
          if [[ "$DISCOVER_RESULT" != "success" ]]; then
            INCOMPLETE=true
          elif [[ "$SWEEP_RESULT" != "success" && ! ( "$SWEEP_RESULT" == "skipped" && "$REPOS" == "[]" ) ]]; then
            INCOMPLETE=true
          fi
          if [[ "$DOWNLOAD_OUTCOME" != "success" ]]; then
            INCOMPLETE=true
          fi

          HAS_RESULTS=false
          if [[ -d results && -n "$(ls -A results)" ]]; then
            HAS_RESULTS=true
          fi
          if [[ "$HAS_RESULTS" == "false" && "$INCOMPLETE" == "false" ]]; then
            echo "No repositories required attention this run."
            exit 0
          fi

          {
            echo "## Failed-check delegation — $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo ""
            if [[ "$INCOMPLETE" == "true" ]]; then
              echo "⚠️ This run did not complete successfully (discover: ${DISCOVER_RESULT}, sweep: ${SWEEP_RESULT}, download: ${DOWNLOAD_OUTCOME}); results may be missing or incomplete. Check the workflow run logs."
              echo ""
            fi
            if [[ "$HAS_RESULTS" == "true" ]]; then
              echo "| Repo | Delegated | Escalated |"
              echo "| --- | --- | --- |"
              for f in results/*.json; do
                jq -r 'if .failed then [.repo, "⚠️ FAILED - see run logs", ""] else [.repo, (.delegated | tostring) + " (" + .delegated_prs + ")", (.escalated | tostring) + " (" + .escalated_prs + ")"] end | "| " + join(" | ") + " |"' "$f"
              done
            else
              echo "No per-repository results were produced for this run."
            fi
          } | tee -a "$GITHUB_STEP_SUMMARY" > body.md

          ISSUE_NUM=$(gh issue list --repo "${{ github.repository }}" --search "Self-heal activity log in:title" --state open --json number --jq '.[0].number // empty')
          if [[ -z "$ISSUE_NUM" ]]; then
            ISSUE_NUM=$(gh api "repos/${{ github.repository }}/issues" -f title="Self-heal activity log" -f body="Tracking issue for scheduled platform-devex maintenance activity. Comments are added only when a repository needs attention or a run is incomplete." --jq '.number')
          fi
          if [[ -z "$ISSUE_NUM" ]]; then
            echo "::error::could not resolve or create the self-heal activity log issue"
            exit 1
          fi
          gh issue comment "$ISSUE_NUM" --repo "${{ github.repository }}" --body-file body.md
          if [[ "$DOWNLOAD_OUTCOME" != "success" ]]; then
            echo "::error::activity results could not be downloaded; the posted summary is incomplete"
            exit 1
          fi
