name: Self-Heal Pull Requests

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: platform-devex-self-heal
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      repos: ${{ steps.list.outputs.repos }}
    steps:
      - name: Create discovery GitHub App token
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349
        with:
          app-id: ${{ vars.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PEM }}
          owner: ${{ github.repository_owner }}

      - name: List installation repositories
        id: list
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail

          names=$(gh api /installation/repositories --paginate --jq '.repositories[].name')
          repos_json=$(printf '%s\n' "$names" | jq -R -s -c 'split("\n") | map(select(length > 0))')

          echo "repos=$repos_json" >>"$GITHUB_OUTPUT"

  sweep:
    needs: discover
    if: ${{ needs.discover.outputs.repos != '[]' }}
    runs-on: ubuntu-latest
    permissions: {}
    strategy:
      fail-fast: false
      matrix:
        repo: ${{ fromJson(needs.discover.outputs.repos) }}
    steps:
      - name: Create repository-scoped GitHub App token
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349
        with:
          app-id: ${{ vars.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PEM }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ matrix.repo }}
          permission-contents: write
          permission-pull-requests: write
          permission-checks: read
          permission-actions: write
          permission-issues: write

      - name: Update stale auto-merge branches
        if: ${{ always() && steps.app-token.outcome == 'success' }}
        uses: frasermolyneux/actions/stale-branch-sweep@stale-branch-sweep/v1
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          repository: ${{ github.repository_owner }}/${{ matrix.repo }}

      - name: Delegate failed checks to Copilot
        if: ${{ always() && steps.app-token.outcome == 'success' }}
        uses: frasermolyneux/actions/delegate-failed-checks@delegate-failed-checks/v1
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          mention-token: ${{ secrets.COPILOT_AGENT_PAT }}
          repository: ${{ github.repository_owner }}/${{ matrix.repo }}

      - name: Release pending Copilot workflow runs
        if: ${{ always() && steps.app-token.outcome == 'success' }}
        uses: frasermolyneux/actions/approve-copilot-workflow-runs@approve-copilot-workflow-runs/v1
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          copilot-token: ${{ secrets.COPILOT_AGENT_PAT }}
          repository: ${{ github.repository_owner }}/${{ matrix.repo }}
          bot-login: ${{ steps.app-token.outputs.app-slug }}[bot]
