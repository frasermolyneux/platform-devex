name: Self-Heal Pull Requests

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: platform-devex-self-heal
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      repos: ${{ steps.list.outputs.repos }}
    steps:
      - name: Create discovery GitHub App token
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349
        with:
          app-id: ${{ vars.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PEM }}
          owner: ${{ github.repository_owner }}

      - name: List installation repositories
        id: list
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail

          names=$(gh api /installation/repositories --paginate --jq '.repositories[].name')
          repos_json=$(printf '%s\n' "$names" | jq -R -s -c 'split("\n") | map(select(length > 0))')

          echo "repos=$repos_json" >>"$GITHUB_OUTPUT"

  sweep:
    needs: discover
    if: ${{ needs.discover.outputs.repos != '[]' }}
    runs-on: ubuntu-latest
    permissions: {}
    strategy:
      fail-fast: false
      matrix:
        repo: ${{ fromJson(needs.discover.outputs.repos) }}
    steps:
      - name: Create repository-scoped GitHub App token
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349
        with:
          app-id: ${{ vars.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PEM }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ matrix.repo }}
          permission-contents: write
          permission-pull-requests: write
          permission-checks: read
          permission-actions: write

      - name: Update stale auto-merge branches
        id: stale-branch-sweep
        if: ${{ always() && steps.app-token.outcome == 'success' }}
        uses: frasermolyneux/actions/stale-branch-sweep@stale-branch-sweep/v1
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          repository: ${{ github.repository_owner }}/${{ matrix.repo }}

      - name: Delegate failed checks to Copilot
        id: delegate-failed-checks
        if: ${{ always() && steps.app-token.outcome == 'success' }}
        uses: frasermolyneux/actions/delegate-failed-checks@delegate-failed-checks/v1
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          mention-token: ${{ secrets.COPILOT_AGENT_PAT }}
          repository: ${{ github.repository_owner }}/${{ matrix.repo }}
          trusted-bot-login: ${{ steps.app-token.outputs.app-slug }}[bot]

      - name: Release pending Copilot workflow runs
        id: approve-copilot-workflow-runs
        if: ${{ always() && steps.app-token.outcome == 'success' }}
        uses: frasermolyneux/actions/approve-copilot-workflow-runs@approve-copilot-workflow-runs/v1
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          copilot-token: ${{ secrets.COPILOT_AGENT_PAT }}
          repository: ${{ github.repository_owner }}/${{ matrix.repo }}
          bot-login: ${{ steps.app-token.outputs.app-slug }}[bot]
          # github-actions[bot] is the actor GitHub records for a Dependabot
          # pull request's pending action_required runs (Dependabot itself
          # never appears as a run actor) - only trusted here when paired
          # with dependabot[bot] as the pull request's own author, per
          # extra-trusted-pr-authors.
          extra-trusted-actors: "github-actions[bot]"
          extra-trusted-pr-authors: "dependabot[bot]"

      - name: Write per-repo activity summary
        id: activity-summary
        if: always()
        shell: bash
        env:
          REPO: ${{ matrix.repo }}
          APP_TOKEN_OUTCOME: ${{ steps.app-token.outcome }}
          STALE_OUTCOME: ${{ steps.stale-branch-sweep.outcome }}
          DELEGATE_OUTCOME: ${{ steps.delegate-failed-checks.outcome }}
          APPROVE_OUTCOME: ${{ steps.approve-copilot-workflow-runs.outcome }}
          UPDATED_COUNT: ${{ steps.stale-branch-sweep.outputs.updated_count }}
          UPDATED_PRS: ${{ steps.stale-branch-sweep.outputs.updated_pull_requests }}
          DELEGATED_COUNT: ${{ steps.delegate-failed-checks.outputs.delegated_count }}
          DELEGATED_PRS: ${{ steps.delegate-failed-checks.outputs.delegated_pull_requests }}
          ESCALATED_COUNT: ${{ steps.delegate-failed-checks.outputs.escalated_count }}
          ESCALATED_PRS: ${{ steps.delegate-failed-checks.outputs.escalated_pull_requests }}
          APPROVED_COUNT: ${{ steps.approve-copilot-workflow-runs.outputs.approved_count }}
          APPROVED_PRS: ${{ steps.approve-copilot-workflow-runs.outputs.approved_pull_requests }}
          BLOCKED_COUNT: ${{ steps.approve-copilot-workflow-runs.outputs.blocked_count }}
        run: |
          set -euo pipefail

          # A step outcome of "failure" means it actually ran and errored;
          # "skipped" (e.g. because app-token itself failed, so the `if:`
          # guards on every later step were never satisfied) is handled by
          # the explicit APP_TOKEN_OUTCOME check instead, since a skipped
          # step's own outcome can't be distinguished from "never needed to
          # run" on its own.
          FAILED=false
          if [[ "$APP_TOKEN_OUTCOME" != "success" ]]; then
            FAILED=true
          fi
          for OUTCOME in "$STALE_OUTCOME" "$DELEGATE_OUTCOME" "$APPROVE_OUTCOME"; do
            if [[ "$OUTCOME" == "failure" ]]; then
              FAILED=true
            fi
          done

          TOTAL=$(( ${UPDATED_COUNT:-0} + ${DELEGATED_COUNT:-0} + ${ESCALATED_COUNT:-0} + ${APPROVED_COUNT:-0} + ${BLOCKED_COUNT:-0} ))

          # Only a repo where the sweep actually did (or flagged) something,
          # or outright failed, gets a row - a clean sweep across dozens of
          # quiet repos would otherwise bury the handful that matter in
          # noise. Report this via an explicit step output rather than
          # hashFiles() on the written JSON file: hashFiles() only searches
          # within GITHUB_WORKSPACE, so it can never match a file written
          # under RUNNER_TEMP (as this one is) and would leave the next
          # step's upload condition always false.
          if [[ "$FAILED" == "false" && "$TOTAL" -eq 0 ]]; then
            echo "has_activity=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "has_activity=true" >> "$GITHUB_OUTPUT"

          # A failed sweep must never be silently reported as "quiet": that
          # would mask real outages (e.g. the App token being misconfigured
          # or revoked) as if nothing needed attention this run.
          if [[ "$FAILED" == "true" ]]; then
            {
              echo "| ${REPO} | ⚠️ sweep failed - see run logs | | | | |"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "| ${REPO} | ${UPDATED_COUNT:-0} (${UPDATED_PRS:-}) | ${DELEGATED_COUNT:-0} (${DELEGATED_PRS:-}) | ${ESCALATED_COUNT:-0} (${ESCALATED_PRS:-}) | ${APPROVED_COUNT:-0} (${APPROVED_PRS:-}) | ${BLOCKED_COUNT:-0} |"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          mkdir -p "${RUNNER_TEMP}/sweep-result"
          FAILED_JSON=false
          if [[ "$FAILED" == "true" ]]; then
            FAILED_JSON=true
          fi
          jq -n \
            --arg repo "$REPO" \
            --argjson failed "$FAILED_JSON" \
            --argjson updated "${UPDATED_COUNT:-0}" \
            --arg updated_prs "${UPDATED_PRS:-}" \
            --argjson delegated "${DELEGATED_COUNT:-0}" \
            --arg delegated_prs "${DELEGATED_PRS:-}" \
            --argjson escalated "${ESCALATED_COUNT:-0}" \
            --arg escalated_prs "${ESCALATED_PRS:-}" \
            --argjson approved "${APPROVED_COUNT:-0}" \
            --arg approved_prs "${APPROVED_PRS:-}" \
            --argjson blocked "${BLOCKED_COUNT:-0}" \
            '{repo: $repo, failed: $failed, updated: $updated, updated_prs: $updated_prs, delegated: $delegated, delegated_prs: $delegated_prs, escalated: $escalated, escalated_prs: $escalated_prs, approved: $approved, approved_prs: $approved_prs, blocked: $blocked}' \
            > "${RUNNER_TEMP}/sweep-result/${REPO}.json"

      - name: Upload activity result
        if: ${{ always() && steps.activity-summary.outputs.has_activity == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sweep-result-${{ matrix.repo }}
          path: ${{ runner.temp }}/sweep-result/*.json
          retention-days: 7

  summarize:
    needs: [discover, sweep]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      issues: write
      actions: read
    steps:
      - name: Download activity results
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: sweep-result-*
          path: results
          merge-multiple: true

      - name: Build and post activity summary
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DISCOVER_RESULT: ${{ needs.discover.result }}
          SWEEP_RESULT: ${{ needs.sweep.result }}
        run: |
          set -euo pipefail

          # Missing artifacts alone don't prove a quiet run: this job runs
          # with always(), so a failed/cancelled discover or sweep job (or
          # even just a failed Upload activity result step within it) can
          # leave no artifact, or only a partial set, behind. Checking the
          # upstream jobs' own result is the only way to tell "nothing
          # needed attention" apart from "the run itself didn't finish".
          INCOMPLETE=false
          if [[ "$DISCOVER_RESULT" != "success" ]]; then
            echo "::warning::repository discovery did not complete successfully (result: ${DISCOVER_RESULT}); this run's summary may be missing or incomplete"
            INCOMPLETE=true
          elif [[ "$SWEEP_RESULT" != "success" ]]; then
            echo "::warning::sweep job did not complete successfully (result: ${SWEEP_RESULT}); this run's summary may be incomplete"
            INCOMPLETE=true
          fi

          HAS_RESULTS=true
          if [[ ! -d results ]] || [[ -z "$(ls -A results 2>/dev/null)" ]]; then
            HAS_RESULTS=false
          fi

          # Only skip reporting entirely when the run both completed
          # successfully and genuinely had nothing to report - an
          # incomplete run must always be surfaced, even with zero
          # artifacts, rather than being indistinguishable from a clean
          # quiet run.
          if [[ "$HAS_RESULTS" == "false" && "$INCOMPLETE" == "false" ]]; then
            echo "No repositories required attention this run."
            exit 0
          fi

          {
            echo "## Self-heal activity — $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo ""
            if [[ "$INCOMPLETE" == "true" ]]; then
              echo "⚠️ This run did not complete successfully (discover: ${DISCOVER_RESULT}, sweep: ${SWEEP_RESULT}); the table below may be missing repositories or incomplete. Check the workflow run logs."
              echo ""
            fi
            if [[ "$HAS_RESULTS" == "true" ]]; then
              echo "| Repo | Branches updated | Delegated | Escalated | Runs approved | Runs left blocked |"
              echo "| --- | --- | --- | --- | --- | --- |"
              for f in results/*.json; do
                jq -r 'if .failed then [.repo, "⚠️ FAILED - see run logs", "", "", "", ""] else [.repo, (.updated | tostring) + " (" + .updated_prs + ")", (.delegated | tostring) + " (" + .delegated_prs + ")", (.escalated | tostring) + " (" + .escalated_prs + ")", (.approved | tostring) + " (" + .approved_prs + ")", (.blocked | tostring)] end | "| " + join(" | ") + " |"' "$f"
              done
            else
              echo "No per-repository results were produced for this run."
            fi
          } | tee -a "$GITHUB_STEP_SUMMARY" > body.md

          # Reuse a single open tracking issue across runs rather than
          # opening a new one every 30 minutes - only the most recent
          # activity needs to be visible at a glance.
          ISSUE_NUM=$(gh issue list --repo "${{ github.repository }}" --search "Self-heal activity log in:title" --state open --json number --jq '.[0].number // empty')
          if [[ -z "$ISSUE_NUM" ]]; then
            # `gh issue create` does not support --json/--jq (unlike
            # `gh issue list`), so it was previously piped through a
            # `|| fallback` that ran outside the failing command
            # substitution and never actually fed ISSUE_NUM, leaving it
            # empty on the very first run. `gh api` supports --jq directly.
            ISSUE_NUM=$(gh api "repos/${{ github.repository }}/issues" -f title="Self-heal activity log" -f body="Tracking issue for self-heal.yml activity summaries. Comments are added only for runs where at least one repository needed attention." --jq '.number')
          fi

          if [[ -n "$ISSUE_NUM" ]]; then
            gh issue comment "$ISSUE_NUM" --repo "${{ github.repository }}" --body-file body.md
          else
            echo "::warning::could not resolve or create the self-heal activity log issue; summary is only available in this run's step summary"
          fi
